name: Publish BlackServ VPN v0.5.3 OTA

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/publish-blackserv-vpn-v053.yml'

permissions:
  contents: write
  issues: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ZIP_SHA256: c6cf3e264a76ce9ed2feee350187dc77ebf9a192196ee1da04181e55ab0abaef
      APK_SHA256: 188ef8cd2c9b6e909f0fc1add755bf12f002df26e0b660053a3985e3d858e032
      CERT_SHA256: 22427f181e5b09a2bd9d669edaff753788d29ca742bb22bcb868464b4acc59ae

    steps:
      - name: Checkout release repository
        uses: actions/checkout@v4

      - name: Resolve verified artifact URL
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          COMMENTS="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/2/comments?per_page=100")"
          URL="$(jq -r '.[].body' <<<"$COMMENTS" | grep '^ARTIFACT_URL:' | tail -1 | cut -d: -f2-)"
          test -n "$URL"
          printf '%s' "$URL" > /tmp/artifact-url

      - name: Download and verify signed APK artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          URL="$(cat /tmp/artifact-url)"
          curl --fail --location --retry 3 --max-time 180 "$URL" -o /tmp/blackserv-v053.zip
          echo "$ZIP_SHA256  /tmp/blackserv-v053.zip" | sha256sum --check
          rm -rf /tmp/blackserv-v053
          mkdir -p /tmp/blackserv-v053
          unzip -q /tmp/blackserv-v053.zip -d /tmp/blackserv-v053
          APK=/tmp/blackserv-v053/BlackServ-VPN-FireTV-v0.5.3.apk
          test -s "$APK"
          echo "$APK_SHA256  $APK" | sha256sum --check
          grep -q "package: name='eu.blackserv.vpn'" /tmp/blackserv-v053/apk-badging.txt
          grep -q "versionCode='8'" /tmp/blackserv-v053/apk-badging.txt
          grep -q "versionName='0.5.3'" /tmp/blackserv-v053/apk-badging.txt
          grep -qi "certificate SHA-256 digest: $CERT_SHA256" /tmp/blackserv-v053/apk-signature.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" /tmp/blackserv-v053/apk-signature.txt
          grep -q "Verified using v3 scheme (APK Signature Scheme v3): true" /tmp/blackserv-v053/apk-signature.txt

      - name: Publish versioned and latest APK
        shell: bash
        run: |
          set -Eeuo pipefail
          APK=/tmp/blackserv-v053/BlackServ-VPN-FireTV-v0.5.3.apk
          mkdir -p downloads
          cp "$APK" downloads/BlackServ-VPN-FireTV-v0.5.3.apk
          cp "$APK" downloads/BlackServ-VPN-FireTV-latest.apk
          cat > downloads/update.json <<JSON
          {
            "versionCode": 8,
            "versionName": "0.5.3",
            "packageName": "eu.blackserv.vpn",
            "apkUrl": "https://raw.githubusercontent.com/llipinsk82-rgb/BlackServ-SSH-Releases/main/downloads/BlackServ-VPN-FireTV-latest.apk",
            "sha256": "$APK_SHA256",
            "certificateSha256": "$CERT_SHA256"
          }
          JSON
          find downloads -maxdepth 1 -type f -name '*.apk' -print0 | sort -z | xargs -0 sha256sum > downloads/SHA256SUMS.txt

      - name: Commit OTA release
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "BlackServ Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add downloads
          git commit -m "release: publish BlackServ VPN v0.5.3 OTA"
          git push origin HEAD:main

      - name: Clean temporary transfer data
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/issues/2/comments?per_page=100" --jq '.[].id' | while read -r id; do
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/issues/comments/$id"
          done
          gh issue close 2 --repo "$GITHUB_REPOSITORY" --comment "BlackServ VPN v0.5.3 OTA published and temporary transfer data removed."
