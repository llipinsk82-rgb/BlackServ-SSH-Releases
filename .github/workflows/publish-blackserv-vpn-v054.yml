name: Publish BlackServ VPN v0.5.4 OTA

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/publish-blackserv-vpn-v054.yml'

permissions:
  contents: write
  issues: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ZIP_SHA256: a527b2506fe755240103272f49d1658ed4b70b5e655d3430dc5bdd31508657ac
      APK_SHA256: fc7f58fd917cffc1677a95aee8cc5f70cc38dcabdc3a0bec0822ff0fa85a6989
      CERT_SHA256: 22427f181e5b09a2bd9d669edaff753788d29ca742bb22bcb868464b4acc59ae

    steps:
      - uses: actions/checkout@v4

      - name: Resolve verified transfer source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          URL="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/3/comments?per_page=100" --jq '.[].body' \
            | grep '^ARTIFACT_URL:' | tail -1 | cut -d: -f2-)"
          case "$URL" in
            https://sdmntprpolandcentral.oaiusercontent.com/files/*) ;;
            *) echo 'Unexpected transfer source' >&2; exit 1 ;;
          esac
          printf '%s' "$URL" > /tmp/artifact-url

      - name: Download and verify artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --fail --location --proto '=https' --retry 3 --max-time 180 \
            "$(cat /tmp/artifact-url)" -o /tmp/blackserv-v054.zip
          echo "$ZIP_SHA256  /tmp/blackserv-v054.zip" | sha256sum --check
          mkdir -p /tmp/blackserv-v054
          unzip -q /tmp/blackserv-v054.zip -d /tmp/blackserv-v054
          APK=/tmp/blackserv-v054/BlackServ-VPN-FireTV-v0.5.4.apk
          echo "$APK_SHA256  $APK" | sha256sum --check
          grep -q "package: name='eu.blackserv.vpn'" /tmp/blackserv-v054/apk-badging.txt
          grep -q "versionCode='9'" /tmp/blackserv-v054/apk-badging.txt
          grep -q "versionName='0.5.4'" /tmp/blackserv-v054/apk-badging.txt
          grep -qi "certificate SHA-256 digest: $CERT_SHA256" /tmp/blackserv-v054/apk-signature.txt
          grep -q 'Verified using v1 scheme (JAR signing): true' /tmp/blackserv-v054/apk-signature.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/blackserv-v054/apk-signature.txt
          grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' /tmp/blackserv-v054/apk-signature.txt
          python3 - <<'PY'
          from pathlib import Path
          for file, expected in [('blackserv-app-icon.png', (512, 512)), ('firetv-banner.png', (320, 180))]:
              data = (Path('/tmp/blackserv-v054') / file).read_bytes()
              assert data[:8] == b'\x89PNG\r\n\x1a\n'
              assert (int.from_bytes(data[16:20], 'big'), int.from_bytes(data[20:24], 'big')) == expected
              assert data[25] in (4, 6) or b'tRNS' in data
          PY

      - name: Publish OTA
        shell: bash
        run: |
          set -Eeuo pipefail
          APK=/tmp/blackserv-v054/BlackServ-VPN-FireTV-v0.5.4.apk
          mkdir -p downloads
          cp "$APK" downloads/BlackServ-VPN-FireTV-v0.5.4.apk
          cp "$APK" downloads/BlackServ-VPN-FireTV-latest.apk
          cat > downloads/update.json <<JSON
          {
            "versionCode": 9,
            "versionName": "0.5.4",
            "packageName": "eu.blackserv.vpn",
            "apkUrl": "https://raw.githubusercontent.com/llipinsk82-rgb/BlackServ-SSH-Releases/main/downloads/BlackServ-VPN-FireTV-latest.apk",
            "sha256": "$APK_SHA256",
            "certificateSha256": "$CERT_SHA256"
          }
          JSON
          find downloads -maxdepth 1 -type f -name '*.apk' -print0 | sort -z | xargs -0 sha256sum > downloads/SHA256SUMS.txt
          git config user.name "BlackServ Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add downloads
          git commit -m "release: publish BlackServ VPN v0.5.4 OTA"
          git push origin HEAD:main
