name: Publish BlackServ VPN TV Launcher v1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-blackserv-vpn-launcher-v1.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download and verify launcher artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          URL='https://sdmntprnortheu.oaiusercontent.com/files/00000000-6038-81f4-a1ac-b4171faa594d/raw?se=2026-08-01T21:14:19Z&sp=r&sv=2026-02-06&sr=b&scid=7c6619be-8479-5df1-814c-5028c36ac116&skoid=b5d2651b-fef3-4bb0-a03b-ca59cc22929b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-01T01:19:44Z&ske=2026-08-02T01:19:44Z&sks=b&skv=2026-02-06&sig=ux0rCuKBTBALQrkdKH%2BEz1h4gj9Rs74MK/Iyb6YOOBU%3D'
          curl --fail --silent --show-error --location --proto '=https' --max-time 120 "$URL" -o /tmp/blackserv-launcher.zip
          echo '66dfc579175b8bf9b32d59ccac5973738f57fa3ac554c032e689c0efad0e40b8  /tmp/blackserv-launcher.zip' | sha256sum --check
          mkdir -p /tmp/blackserv-launcher
          unzip -q /tmp/blackserv-launcher.zip -d /tmp/blackserv-launcher
          APK=/tmp/blackserv-launcher/BlackServ-VPN-TV-Launcher-v1.0.0.apk
          test -s "$APK"
          echo 'e842da282edb4fb5fba2c9120d726d1b112677b3b94d1028c0240074ea60fb27  '"$APK" | sha256sum --check
          grep -q "package: name='eu.blackserv.vpn.launcher'" /tmp/blackserv-launcher/apk-badging.txt
          grep -q "versionCode='1'" /tmp/blackserv-launcher/apk-badging.txt
          grep -q "leanback-launchable-activity: name='eu.blackserv.vpn.launcher.MainActivity'.*banner='res/" /tmp/blackserv-launcher/apk-badging.txt
          ! grep -q '^launchable-activity:' /tmp/blackserv-launcher/apk-badging.txt
          file /tmp/blackserv-launcher/blackserv-launcher-banner.webp | grep -q '320x180'

      - name: Publish launcher APK and manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p downloads
          cp /tmp/blackserv-launcher/BlackServ-VPN-TV-Launcher-v1.0.0.apk downloads/BlackServ-VPN-TV-Launcher-v1.0.0.apk
          cp /tmp/blackserv-launcher/BlackServ-VPN-TV-Launcher-v1.0.0.apk downloads/BlackServ-VPN-TV-Launcher-latest.apk

          cat > downloads/launcher.json <<'EOF'
          {
            "versionCode": 1,
            "versionName": "1.0.0",
            "packageName": "eu.blackserv.vpn.launcher",
            "targetPackage": "eu.blackserv.vpn",
            "apkUrl": "https://raw.githubusercontent.com/llipinsk82-rgb/BlackServ-SSH-Releases/main/downloads/BlackServ-VPN-TV-Launcher-latest.apk",
            "sha256": "e842da282edb4fb5fba2c9120d726d1b112677b3b94d1028c0240074ea60fb27",
            "certificateSha256": "22427f181e5b09a2bd9d669edaff753788d29ca742bb22bcb868464b4acc59ae"
          }
          EOF

          cat > downloads/BlackServ-VPN-TV-Launcher-SHA256.txt <<'EOF'
          e842da282edb4fb5fba2c9120d726d1b112677b3b94d1028c0240074ea60fb27  BlackServ-VPN-TV-Launcher-v1.0.0.apk
          e842da282edb4fb5fba2c9120d726d1b112677b3b94d1028c0240074ea60fb27  BlackServ-VPN-TV-Launcher-latest.apk
          EOF

          git config user.name 'BlackServ Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add downloads/BlackServ-VPN-TV-Launcher-v1.0.0.apk \
            downloads/BlackServ-VPN-TV-Launcher-latest.apk \
            downloads/launcher.json \
            downloads/BlackServ-VPN-TV-Launcher-SHA256.txt
          git commit -m 'release: publish BlackServ VPN TV Launcher v1.0.0'
          git push

      - name: Request CDN refresh
        continue-on-error: true
        shell: bash
        run: |
          curl --fail --silent --show-error --location --max-time 30 \
            'https://purge.jsdelivr.net/gh/llipinsk82-rgb/BlackServ-SSH-Releases@main/downloads/launcher.json'
          curl --fail --silent --show-error --location --max-time 30 \
            'https://purge.jsdelivr.net/gh/llipinsk82-rgb/BlackServ-SSH-Releases@main/downloads/BlackServ-VPN-TV-Launcher-latest.apk'
