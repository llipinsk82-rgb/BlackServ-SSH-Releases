name: Publish BlackServ VPN v0.5.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-blackserv-vpn-v050.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout public releases
        uses: actions/checkout@v4

      - name: Download and verify signed artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --fail --location --retry 3 --max-time 180 \
            'https://sdmntprnortheu.oaiusercontent.com/files/00000000-cb14-81f4-b5ca-01cc11b04399/raw?se=2026-08-01T18:33:10Z&sp=r&sv=2026-02-06&sr=b&scid=8a472954-7603-5e41-ab2c-c9b2a2880e8a&skoid=b5d2651b-fef3-4bb0-a03b-ca59cc22929b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-01T07:28:41Z&ske=2026-08-02T07:28:41Z&sks=b&skv=2026-02-06&sig=fumavG6GqcdAkbvVqfEYpca8qqMKWe8NPP1hE1t/Vtc%3D' \
            --output /tmp/blackserv-vpn-v050.zip
          echo 'ecf591c0642b283599d2b66de8ecd2370171469c109c4b9dfefc3e54d723d3ee  /tmp/blackserv-vpn-v050.zip' | sha256sum --check

          rm -rf /tmp/blackserv-vpn-v050
          mkdir -p /tmp/blackserv-vpn-v050
          unzip -q /tmp/blackserv-vpn-v050.zip -d /tmp/blackserv-vpn-v050
          APK="$(find /tmp/blackserv-vpn-v050 -type f -name 'BlackServ-VPN-FireTV-v0.5.0.apk' -print -quit)"
          test -n "$APK"
          echo '8687b68984c5140873dd4e869b105c2f5293ee4b8b3001de662a5e3064cf1254  '"$APK" | sha256sum --check

          mkdir -p downloads
          cp "$APK" downloads/BlackServ-VPN-FireTV-v0.5.0.apk
          cp "$APK" downloads/BlackServ-VPN-FireTV-latest.apk

          cat >downloads/update.json <<'JSON'
          {
            "versionCode": 5,
            "versionName": "0.5.0",
            "packageName": "eu.blackserv.vpn",
            "apkUrl": "https://raw.githubusercontent.com/llipinsk82-rgb/BlackServ-SSH-Releases/main/downloads/BlackServ-VPN-FireTV-latest.apk",
            "sha256": "8687b68984c5140873dd4e869b105c2f5293ee4b8b3001de662a5e3064cf1254",
            "certificateSha256": "22427f181e5b09a2bd9d669edaff753788d29ca742bb22bcb868464b4acc59ae"
          }
          JSON

          (
            cd downloads
            sha256sum BlackServ-VPN-FireTV-v0.5.0.apk BlackServ-VPN-FireTV-latest.apk > SHA256SUMS.txt
          )

      - name: Publish public direct-download files
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'BlackServ Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add downloads/BlackServ-VPN-FireTV-v0.5.0.apk \
                  downloads/BlackServ-VPN-FireTV-latest.apk \
                  downloads/SHA256SUMS.txt \
                  downloads/update.json
          git commit -m 'Publish BlackServ VPN Fire TV v0.5.0 signed release'
          git push origin HEAD:main
