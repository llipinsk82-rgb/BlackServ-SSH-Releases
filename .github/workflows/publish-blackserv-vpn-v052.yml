name: Publish BlackServ VPN v0.5.2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-blackserv-vpn-v052.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download verified build artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          URL='https://sdmntpritalynorth.oaiusercontent.com/files/00000000-8ee4-8246-bba5-8416d6ef6916/raw?se=2026-08-01T20:34:42Z&sp=r&sv=2026-02-06&sr=b&scid=3d37e667-ba63-5042-a94e-a6335ac585ae&skoid=b5d2651b-fef3-4bb0-a03b-ca59cc22929b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-01T04:51:35Z&ske=2026-08-02T04:51:35Z&sks=b&skv=2026-02-06&sig=CKwvF2fXMsZD7JRY%2Bx7rWRnXcOtlIF6eqFUHUZQfcjQ%3D'
          curl --fail --silent --show-error --location --proto '=https' --max-time 120 "$URL" -o /tmp/blackserv-v052.zip
          echo 'a24b433634cf93d7cc2ea0d95db1cbae619de34f674c0b00c0455a3169f5a9a9  /tmp/blackserv-v052.zip' | sha256sum --check
          mkdir -p /tmp/blackserv-v052
          unzip -q /tmp/blackserv-v052.zip -d /tmp/blackserv-v052
          APK=/tmp/blackserv-v052/BlackServ-VPN-FireTV-v0.5.2.apk
          test -s "$APK"
          echo 'a190308e76da28e4e27c382ef24b2ea5ad394efc304844a07554dbf0a381a408  '"$APK" | sha256sum --check
          grep -q "versionCode='7'" /tmp/blackserv-v052/apk-badging.txt
          grep -q "versionName='0.5.2'" /tmp/blackserv-v052/apk-badging.txt
          grep -q "application:.*icon='res/.*'.*banner='res/" /tmp/blackserv-v052/apk-badging.txt
          file /tmp/blackserv-v052/firetv-app-icon.webp | grep -q '320x180'

      - name: Publish stable and versioned APK
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p downloads
          cp /tmp/blackserv-v052/BlackServ-VPN-FireTV-v0.5.2.apk downloads/BlackServ-VPN-FireTV-v0.5.2.apk
          cp /tmp/blackserv-v052/BlackServ-VPN-FireTV-v0.5.2.apk downloads/BlackServ-VPN-FireTV-latest.apk

          cat > downloads/SHA256SUMS.txt <<'EOF'
          a190308e76da28e4e27c382ef24b2ea5ad394efc304844a07554dbf0a381a408  BlackServ-VPN-FireTV-v0.5.2.apk
          a190308e76da28e4e27c382ef24b2ea5ad394efc304844a07554dbf0a381a408  BlackServ-VPN-FireTV-latest.apk
          EOF

          cat > downloads/update.json <<'EOF'
          {
            "versionCode": 7,
            "versionName": "0.5.2",
            "packageName": "eu.blackserv.vpn",
            "apkUrl": "https://raw.githubusercontent.com/llipinsk82-rgb/BlackServ-SSH-Releases/main/downloads/BlackServ-VPN-FireTV-latest.apk",
            "sha256": "a190308e76da28e4e27c382ef24b2ea5ad394efc304844a07554dbf0a381a408",
            "certificateSha256": "22427f181e5b09a2bd9d669edaff753788d29ca742bb22bcb868464b4acc59ae"
          }
          EOF

          git config user.name 'BlackServ Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add downloads/BlackServ-VPN-FireTV-v0.5.2.apk downloads/BlackServ-VPN-FireTV-latest.apk downloads/SHA256SUMS.txt downloads/update.json
          git commit -m 'release: publish BlackServ VPN v0.5.2'
          git push

      - name: Request CDN refresh
        continue-on-error: true
        shell: bash
        run: |
          curl --fail --silent --show-error --location --max-time 30 \
            'https://purge.jsdelivr.net/gh/llipinsk82-rgb/BlackServ-SSH-Releases@main/downloads/update.json'
          curl --fail --silent --show-error --location --max-time 30 \
            'https://purge.jsdelivr.net/gh/llipinsk82-rgb/BlackServ-SSH-Releases@main/downloads/BlackServ-VPN-FireTV-latest.apk'
